# Complete Docker Compose for Darch Application
# Includes frontend, backend, and supporting services
version: '3.8'

services:
  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darch-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Backend API URL
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - darch-network

  # Backend API (placeholder - adjust according to your backend)
  backend:
    image: darch-backend:latest  # Replace with your actual backend image
    container_name: darch-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - darch-network
    profiles:
      - full-stack

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: darch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl  # For SSL certificates
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - darch-network
    profiles:
      - production

networks:
  darch-network:
    driver: bridge
    name: darch-network

volumes:
  # Persistent volumes for data
  backend-data:
    name: darch-backend-data
